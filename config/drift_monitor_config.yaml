# config/drift_monitor_config.yaml
# ETSI Concept Drift Monitor Configuration

# General Settings
general:
  service_name: "etsi-concept-drift-monitor"
  version: "1.0.0"
  debug: false
  log_level: "INFO"

# Drift Detection Settings
drift_detection:
  # Detection methods to use
  detection_methods:
    - "ddm"      # Drift Detection Method
    - "eddm"     # Early Drift Detection Method  
    - "adwin"    # Adaptive Windowing
  
  # Window size for drift detection
  window_size: 1000
  
  # History size for metrics storage
  metrics_history_size: 5000
  
  # DDM specific parameters
  ddm:
    min_num_instances: 30
    warning_level: 2.0
    out_control_level: 3.0
  
  # EDDM specific parameters
  eddm:
    alpha: 0.95
    beta: 0.9
    min_num_instances: 30
  
  # ADWIN specific parameters
  adwin:
    delta: 0.002

# Alert Settings
alerts:
  # Threshold values for generating alerts
  thresholds:
    performance_decline: 0.05      # 5% decline in performance
    error_rate_increase: 0.1       # 10% increase in error rate
    confidence_drop: 0.15          # 15% drop in confidence
    drift_rate_high: 0.3           # 30% drift rate considered high
  
  # Alert destinations
  destinations:
    email:
      enabled: true
      smtp_server: "smtp.gmail.com"
      smtp_port: 587
      username: "alerts@yourcompany.com"
      password: "${EMAIL_PASSWORD}"
      recipients:
        - "ml-team@yourcompany.com"
        - "devops@yourcompany.com"
    
    slack:
      enabled: true
      webhook_url: "${SLACK_WEBHOOK_URL}"
      channel: "#ml-alerts"
    
    webhook:
      enabled: true
      url: "${WEBHOOK_URL}"
      headers:
        Authorization: "Bearer ${WEBHOOK_TOKEN}"
  
  # Alert frequency limits
  rate_limiting:
    max_alerts_per_model_per_hour: 5
    max_critical_alerts_per_hour: 10

# Database Settings
database:
  url: "postgresql://etsi_user:etsi_password@localhost:5432/etsi_drift_db"

database:
  postgresql:
    host: "localhost"
    port: 5432
    database: "drift_monitor"
    username: "postgres"
    password: "password"
    pool_size: 20
    max_overflow: 30
  
  # Redis settings (for caching and session storage)
  redis:
    host: "${REDIS_HOST:-localhost}"
    port: 6379
    db: 0
    password: "${REDIS_PASSWORD:-}"

# Monitoring and Metrics
monitoring:
  # Prometheus metrics
  prometheus:
    enabled: true
    port: 8000
    metrics_path: "/metrics"
  
  # Health check settings
  health_check:
    enabled: true
    path: "/health"
    timeout: 10
  
  # Performance monitoring
  performance:
    track_response_times: true
    track_memory_usage: true
    track_cpu_usage: true

# Model Management
models:
  # Model registration settings
  registration:
    auto_discovery: false
    require_baseline: true
    
  # Model evaluation settings
  evaluation:
    batch_size: 1000
    parallel_processing: true
    max_workers: 4
  
  # Model lifecycle management
  lifecycle:
    auto_retrain_threshold: 0.8  # Health score below 80% triggers retraining recommendation
    backup_model_threshold: 0.5  # Health score below 50% suggests switching to backup
    deprecation_threshold: 0.3   # Health score below 30% suggests model deprecation

# API Settings
api:
  # Rate limiting
  rate_limiting:
    enabled: true
    requests_per_minute: 100
    burst_size: 20
  
  # CORS settings
  cors:
    enabled: true
    origins:
      - "http://localhost:3000"
      - "https://yourdomain.com"
  
  # Authentication (if enabled)
  authentication:
    enabled: false
    jwt_secret: "${JWT_SECRET}"
    token_expiry: 3600  # 1 hour

# Logging Configuration
logging:
  level: "${LOG_LEVEL:-INFO}"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  
  # File logging
  file:
    enabled: true
    path: "/app/logs/drift_monitor.log"
    max_size: "100MB"
    backup_count: 5
    rotation: "daily"
  
  # Structured logging for ELK stack
  structured:
    enabled: true
    format: "json"
    fields:
      - "timestamp"
      - "level"
      - "message"
      - "model_id"
      - "drift_detected"
      - "alert_severity"

# Integration Settings
integrations:
  # MLflow integration
  mlflow:
    enabled: false
    tracking_uri: "${MLFLOW_TRACKING_URI}"
    experiment_name: "concept_drift_monitoring"
  
  # Kubernetes integration
  kubernetes:
    enabled: false
    namespace: "ml-monitoring"
    config_map: "drift-monitor-config"
  
  # Apache Kafka for event streaming
  kafka:
    enabled: false
    bootstrap_servers: "${KAFKA_BOOTSTRAP_SERVERS}"
    topics:
      drift_events: "ml.drift.events"
      alerts: "ml.alerts"
      metrics: "ml.metrics"


