groups:
  - name: drift_monitor_alerts
    rules:
      - alert: HighDriftRate
        expr: |
          (
            sum by (model_id) (increase(drift_detections_total[1h]))
            /
            sum by (model_id) (increase(drift_evaluations_total[1h]))
          ) > 0.3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High drift rate for {{ $labels.model_id }}"
          description: "Drift rate > 30% for model {{ $labels.model_id }}"

      - alert: ModelHealthCritical
        expr: model_health_score < 50
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Model health critically low for {{ $labels.model_id }}"
          description: "Health score is {{ $value }} for {{ $labels.model_id }}"
